name: bnb-airdrop-autopilot
version: 1.0.0
description: "A complete system for BSC airdrops & free mints: scan for new tokens, safety-audit a contract (owner, proxy, approvals, Sourcify verification, DEX liquidity, risk rating), preview a claim via baw (preview only; the user runs the execute command themselves in their own terminal), and report BSC gas with a cheapest-claim recommendation. Safe by design: nothing is broadcast or signed by the plugin."
author: sawi57003-ops
hooks: []
provides_tools:
  - bnb_scan_airdrops
  - bnb_check_contract
  - bnb_prepare_claim
  - bnb_gas_report
